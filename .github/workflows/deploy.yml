name: Deploy

# Publishes main at /dailywhip/ and the frozen prototype branch at
# /dailywhip/prototype/. Pages allows a single deployment per repo, so both
# builds go into one artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # After the app's tests, so Vitest does not pick up the prototype's.
      - uses: actions/checkout@v5
        with:
          ref: prototype
          path: .prototype
      - name: Build the prototype
        working-directory: .prototype
        run: pnpm install --frozen-lockfile && pnpm build
      - run: cp -R .prototype/dist dist/prototype

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
