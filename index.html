<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="15 minutes. No excuses." />
    <meta name="theme-color" content="#000000" />
    <title>Daily Whip</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  </head>
  <body>
    <main class="main">
      <div id="dock">
        <!-- The timer. This element moves into the floating window and back. -->
        <section id="app" class="app" data-phase="normal" aria-label="Daily Whip timer">
          <header class="top">
            <h1 class="title">DAILY WHIP</h1>
            <p id="date"></p>
            <button id="blink" class="icon" type="button" aria-label="Blinking" aria-pressed="true" title="Blinking on">
              <!-- 8×8 pixel lightning bolt -->
              <svg viewBox="0 0 8 8" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges">
                <path
                  fill="currentColor"
                  d="M5 0h2v1h-2zM4 1h2v1h-2zM3 2h2v1h-2zM2 3h5v1h-5zM4 4h2v1h-2zM3 5h2v1h-2zM2 6h2v1h-2zM1 7h2v1h-2z"
                />
              </svg>
            </button>
          </header>
          <div class="display">
            <p id="clock" class="clock" role="timer">15:00</p>
            <div id="timesup" class="timesup" hidden>
              <p class="timesup-title">TIME'S UP!</p>
              <p id="overtime" class="overtime">+00:00</p>
            </div>
          </div>
          <div
            id="progress"
            class="progress"
            role="progressbar"
            aria-label="Time used"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ></div>
          <div class="controls">
            <button id="minus" type="button" aria-label="Subtract 5 minutes">-5</button>
            <button id="toggle" type="button">START</button>
            <button id="plus" type="button" aria-label="Add 5 minutes">+5</button>
          </div>
          <button id="reset" type="button">RESET</button>
        </section>
      </div>

      <div id="docked" class="note" hidden>
        <button id="float" type="button">FLOAT</button>
        <p>Keeps the timer on top of Meet, Teams or Zoom. START does it too.</p>
      </div>
      <div id="floating" class="note" hidden>
        <p>The timer is on top. Keep this window open: you can minimize it.</p>
        <button id="bring-back" type="button">BRING BACK</button>
      </div>
      <p id="unsupported" class="note" hidden>
        This browser can't keep the timer on top. Use Chrome or Edge on desktop.
      </p>

      <p class="slogan">15 minutes. No excuses.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
